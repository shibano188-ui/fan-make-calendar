<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: iOSは入力欄にフォーカスすると自動で拡大し、**元の倍率に戻さない**。
         上限を1にすると拡大自体が起きない。入力欄のフォント下限16pxとの二段構え（index.css）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- PWA -->
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FanHive" />

    <!-- API -->
    <link rel="preconnect" href="https://jsgidtwxhueqgtvshdku.supabase.co" />

    <!-- Google Identity Services（カレンダーOAuth） -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Fonts: OSシステムフォント（iOS=ヒラギノ角ゴ / Android=Noto / Win=游ゴシック）。Webフォント読み込みなし＝ネイティブで高速。 -->

    <!-- OGP -->
    <title>FanHive</title>
    <meta name="description" content="ファン同士で作る共有カレンダー。推しの作品のイベントや記念日をみんなで管理しよう。" />
    <meta property="og:title" content="FanHive" />
    <meta property="og:description" content="ファン同士で作る共有カレンダー。推しの作品のイベントや記念日をみんなで管理しよう。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FanHive" />
    <meta name="twitter:description" content="ファン同士で作る共有カレンダー。推しの作品のイベントや記念日をみんなで管理しよう。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- バリューコマース LinkSwitch: VC提携済み店舗への <a> リンクをクリック時に自動アフィリンク化。
         注: window.open で開く導線（dataLogs.openBuyLink）は対象外。 -->
    <script>var vc_pid = "892664378";</script>
    <script src="//aml.valuecommerce.com/vcdal.js" async></script>
  </body>
</html>
