<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#FFFAF1;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#2A1C22;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-60px;width:760px;height:760px;border-radius:50%;background:#FCF1DC}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:32px}
.brand img{width:44px;height:44px;border-radius:12px}
h1{position:absolute;left:72px;top:180px;font-size:84px;line-height:1.28;font-weight:800;letter-spacing:-.01em}
p{position:absolute;left:72px;top:418px;font-size:28px;line-height:1.75;color:#6B555C;font-weight:500}
.bar{position:absolute;left:72px;top:528px;width:132px;height:8px;border-radius:4px;background:#E7BB5E}
.phone{position:absolute;right:86px;top:92px;width:330px;height:640px;border-radius:46px;background:#EDE3D3;border:1px solid #E0D2BC;padding:9px;box-shadow:0 24px 60px -24px rgba(180,140,60,.45)}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:#fff;padding-top:22px}
.screen img{width:100%;display:block}
</style></head><body>
<div class="glow"></div>
<div class="brand"><img src="icon.png">FanHive</div>
<h1>推し活の予定、<br>ぜんぶここに。</h1>
<p>予約締切も、発売日も、イベントも。<br>あと何日か、ひと目でわかる。</p>
<div class="bar"></div>
<div class="phone"><div class="screen"><img src="s-cal.png"></div></div>
</body></html>
