# 毎朝、SNS 用の「作品ごとの予定表」の画像を作り直して Google ドライブに同期する。
# 中身が前回と変わった作品だけ作り直す（scripts/sns-schedule/run.mjs）。本番の DB は読むだけ。
# Secrets（GDRIVE_*）は scripts/sns-schedule/drive-auth.mjs で入れる。
name: SNS 予定表

on:
  schedule:
    - cron: '0 21 * * *'   # 毎朝 6:00（日本時間）
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/sns-schedule/run.mjs --drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
