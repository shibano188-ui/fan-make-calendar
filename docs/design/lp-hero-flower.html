<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FanHive LP 最初の画面（参考デザイン）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#5A1F3D}a:hover{color:#5A1F3D}
.fh-band{animation:fhBand .7s cubic-bezier(.2,.8,.3,1) both}
.fh-drip{transform-box:fill-box;transform-origin:50% 0;animation:fhGrow .9s cubic-bezier(.5,0,.3,1) both,fhStretch 4.2s ease-in-out infinite}
.fh-d1{animation-delay:.5s,1.6s}.fh-d2{animation-delay:.65s,2.3s}.fh-d3{animation-delay:.55s,1.9s}
.fh-d4{animation-delay:.75s,2.7s}.fh-d5{animation-delay:.6s,2.1s}.fh-d6{animation-delay:.7s,2.5s}
.fh-petal{transform-box:fill-box;transform-origin:50% 100%;animation:fhBloom .7s cubic-bezier(.3,1.4,.5,1) both}
.fh-p1{animation-delay:1s}.fh-p2{animation-delay:1.12s}.fh-p3{animation-delay:1.24s}.fh-p4{animation-delay:1.36s}.fh-p5{animation-delay:1.48s}
.fh-core{transform-box:fill-box;transform-origin:50% 50%;animation:fhBloom .6s cubic-bezier(.3,1.5,.5,1) 1.7s both}
.fh-bud{transform-box:fill-box;transform-origin:50% 100%;animation:fhBloom .6s cubic-bezier(.3,1.4,.5,1) 1.9s both}
.fh-label{animation:fhPop .5s cubic-bezier(.3,1.4,.5,1) 2s both}
.fh-up{animation:fhUp .6s cubic-bezier(.2,.8,.3,1) both}
.fh-u1{animation-delay:2.3s}.fh-u2{animation-delay:2.45s}.fh-u3{animation-delay:2.6s}
.fh-bee{position:absolute;width:28px;height:28px;margin:-28px 0 0 -14px;animation:fhLand .9s cubic-bezier(.3,.1,.3,1) both}
.fh-hop{transform-origin:50% 100%;animation:fhHop 2.5s ease-in-out infinite}
.fh-msg{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;opacity:0;animation:fhMsg 10s ease-in-out infinite both}
.fh-m1{animation-delay:2s}.fh-m2{animation-delay:4.5s}.fh-m3{animation-delay:7s}.fh-m4{animation-delay:9.5s}
@keyframes fhMsg{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:none}22%{opacity:1;transform:none}25%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}
.fh-wing{transform-box:fill-box;transform-origin:50% 100%;animation:fhFlap .14s linear infinite alternate}
.fh-b1{animation-delay:2.4s}.fh-b2{animation-delay:2.6s}.fh-b3{animation-delay:2.8s}.fh-b4{animation-delay:3s}.fh-b5{animation-delay:3.2s}
.fh-h1{animation-delay:4.35s}.fh-h2{animation-delay:4.4s}.fh-h3{animation-delay:4.45s}.fh-h4{animation-delay:4.5s}.fh-h5{animation-delay:4.55s}
.fh-btn{transition:transform .12s ease}
.fh-btn:active{transform:translateY(2px)}
.fh-btn:focus-visible{outline:3px solid #EF8F00;outline-offset:3px}
@keyframes fhBand{from{transform:translateY(-130px)}to{transform:none}}
@keyframes fhGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fhStretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.14)}}
@keyframes fhBloom{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes fhPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fhUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fhLand{0%{transform:translate(var(--fx),-160px);opacity:0}20%{opacity:1}70%{transform:translate(0,-18px)}85%{transform:translate(0,2px) scale(1.1,.9)}100%{transform:none;opacity:1}}
@keyframes fhHop{0%,55%,100%{transform:none}8%{transform:scale(1.12,.86)}20%{transform:translateY(-16px) scale(.94,1.08)}32%{transform:translateY(0) scale(1.1,.9)}42%{transform:none}}
@keyframes fhFlap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}
@media (prefers-reduced-motion: reduce){
  .fh-band,.fh-drip,.fh-petal,.fh-core,.fh-bud,.fh-label,.fh-up,.fh-bee,.fh-hop,.fh-wing,.fh-msg{animation:none}
  .fh-m1{opacity:1}
}
</style>
<style>html{background:#ECECEC}body{display:flex;justify-content:center}</style>
</head>
